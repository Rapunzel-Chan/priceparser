volumes:
  postgres_data:
  media:
  static:

services:
  db:
    image: postgres:16-alpine
    container_name: priceparser_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: priceparser_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  static_collector:
    build: .
    container_name: priceparser_static_collector
    command: python manage.py collectstatic --noinput
    env_file: .env
    volumes:
      - static:/app/static
    depends_on:
      - db
    restart: "no"

  backend:
    image: ${DOCKERHUB_USERNAME}/average_price_parser-app:${IMAGE_TAG}
    container_name: average_price_parser_backend
    depends_on:
      - db
      - redis
      - static_collector
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      STATIC_ROOT: /app/static
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    volumes:
      - media:/app/media
      - static:/app/static
    restart: unless-stopped

  celery:
    image: ${DOCKERHUB_USERNAME}/average_price_parser-app:${IMAGE_TAG}
    container_name: average_price_parser_celery
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config worker -l info
    volumes:
      - media:/app/media
    restart: unless-stopped

  beat:
    image: ${DOCKERHUB_USERNAME}/average_price_parser-app:${IMAGE_TAG}
    container_name: average_price_parser_celery_beat
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config beat -l info
    volumes:
      - media:/app/media
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: average_price_parser_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - static:/app/static
      - media:/app/media
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
