{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Парсер цен{% endblock %}</title>

    <!-- Bootstrap и Theme CSS -->
    <link href="{% static 'sneat/vendor/css/core.css' %}" rel="stylesheet">
    <link href="{% static 'sneat/vendor/css/theme-default.css' %}" rel="stylesheet">
    <link href="{% static 'sneat/css/demo.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body>
<!-- Навбар -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'price_parser:index1' %}">Парсер цен</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'price_parser:index1' %}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'price_parser:products_list' %}">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'price_parser:parsers' %}">Парсеры</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Отчёты</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Настройки</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Контент -->
<main class="container">
    {% block content %}{% endblock %}
</main>

<!-- JS Bootstrap -->
<script src="{% static 'sneat/vendor/js/bootstrap.bundle.min.js' %}"></script>
{% block extra_scripts %}{% endblock %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');
    $.ajaxSetup({
      beforeSend: function(xhr, settings) {
        xhr.setRequestHeader("X-CSRFToken", csrftoken);
      }
    });
</script>
</body>
</html>
