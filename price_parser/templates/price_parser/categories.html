{% extends 'price_parser/base.html' %}
{% block title %}Категории{% endblock %}

{% block content %}
<h4 class="fw-bold py-3 mb-4">Категории</h4>

<div class="card">
  <div class="card-body">
    <ul class="list-group">
      {% for category in categories %}
        <li class="list-group-item">{{ category.name }}</li>
      {% empty %}
        <li class="list-group-item">Нет категорий</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
