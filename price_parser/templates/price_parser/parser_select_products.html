{% extends "price_parser/base.html" %}
{% block title %}Выбор товаров{% endblock %}

{% block content %}
<div class="container mt-4">
  <h3>Выберите товары для парсера {{ parser.name }}</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      {% for product in products %}
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="products" value="{{ product.id }}"
            {% if product in parser.products.all %}checked{% endif %}>
          <label class="form-check-label">{{ product.name }}</label>
        </div>
      {% endfor %}
    </div>
    <button type="submit" class="btn btn-success">Сохранить выбор</button>
  </form>
</div>
{% endblock %}
