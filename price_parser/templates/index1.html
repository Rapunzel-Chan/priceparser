{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выбор товаров</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h2 class="mb-4">Выберите товары</h2>

    <form method="post" action="{% url 'price_parser:show_selected_products' %}">
      {% csrf_token %}
      <input type="hidden" name="category_id" value="{{ selected_category_id }}">

      <!-- Поле ввода с автокомплитом -->
      <div class="mb-3 d-flex gap-2">
        <input type="text" id="productInput" list="productList" class="form-control" placeholder="Начните вводить название" autocomplete="off">
        <button type="button" id="addProductBtn" class="btn btn-secondary">Добавить товар</button>
      </div>
      <datalist id="productList">
        {% for name in product_names %}
          <option value="{{ name }}">
        {% endfor %}
      </datalist>

      <!-- Список выбранных товаров -->
      <ul id="selectedProducts" class="list-group mb-3"></ul>

      <!-- Кнопка отправки -->
      <button type="submit" class="btn btn-primary float-end">Найти цены</button>
    </form>

    <!-- Выбор категории -->
    <hr>
    <h2 class="mb-4">Выбор категории</h2>
    <form method="get" action="">
      <div class="mb-3">
        <label for="category-select" class="form-label">Категория:</label>
        <select id="category-select" name="category" class="form-select" onchange="this.form.submit()">
          <option value="">-- Выберите категорию --</option>
          {% for category in categories %}
            <option value="{{ category.id }}" {% if category.id == selected_category_id %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>
    </form>
  </div>

  <script>
    const input = document.getElementById("productInput");
    const selectedList = document.getElementById("selectedProducts");
    const addBtn = document.getElementById("addProductBtn");

    input.addEventListener("keydown", function (e) {
      if (e.key === "Tab") {
        e.preventDefault();
        addProductFromInput();
      }
    });

    addBtn.addEventListener("click", addProductFromInput);

    function isAlreadySelected(value) {
      const existing = document.querySelectorAll('input[name="products[]"]');
      return Array.from(existing).some(el => el.value === value);
    }

    function addProductFromInput() {
      const value = input.value.trim();
      if (value && !isAlreadySelected(value)) {
        addSelectedProduct(value);
        input.value = "";
        input.focus();
      }
    }

    function addSelectedProduct(value) {
      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between align-items-center";
      li.textContent = value;

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "btn btn-sm btn-outline-danger ms-2";
      removeBtn.textContent = "Удалить";
      removeBtn.onclick = () => li.remove();

      const hiddenInput = document.createElement("input");
      hiddenInput.type = "hidden";
      hiddenInput.name = "products[]";
      hiddenInput.value = value;

      li.appendChild(removeBtn);
      li.appendChild(hiddenInput);
      selectedList.appendChild(li);
    }
  </script>
</body>
</html>
