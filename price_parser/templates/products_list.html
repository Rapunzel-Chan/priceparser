{% extends 'base.html' %}
{% block title %}Каталог{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h5 class="card-title">Каталог товаров</h5>
  </div>
  <div class="card-body">
    <form id="filterForm" class="row g-3 mb-3">
      <div class="col-md-4">
        <label for="category" class="form-label">Категория</label>
        <select id="category" name="category" class="form-select">
          <option value="">Выберите категорию</option>
          {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="subcategory" class="form-label">Подкатегория</label>
        <select id="subcategory" name="subcategory" class="form-select">
          <option value="">Сначала выберите категорию</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="search" class="form-label">Поиск</label>
        <input type="text" name="search" id="search" class="form-control" placeholder="Введите название">
      </div>
    </form>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Название</th>
          <th>Ед. изм</th>
          <th>Фасовка</th>
          <th>Цена за ед.</th>
        </tr>
      </thead>
      <tbody>
        {% for product in products %}
        <tr>
          <td><a href="{% url 'product_detail' product.id %}">{{ product.name }}</a></td>
          <td>{{ product.unit }}</td>
          <td>{{ product.pack_size }}</td>
          <td>{{ product.avg_price_lemanapro }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
