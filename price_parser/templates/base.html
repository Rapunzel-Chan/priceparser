<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Парсер цен{% endblock %}</title>

  <!-- Sneat + Bootstrap 5 (бесплатный CDN) -->
  <link href="https://demos.themeselection.com/sneat-bootstrap-html-admin-template/assets/vendor/css/core.css" rel="stylesheet">
  <link href="https://demos.themeselection.com/sneat-bootstrap-html-admin-template/assets/vendor/css/theme-default.css" rel="stylesheet">
  <link href="https://demos.themeselection.com/sneat-bootstrap-html-admin-template/assets/css/demo.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Навбар -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Парсер цен</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href=#>Каталог</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href=#>Отчёты</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href=#>Настройки</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Контент -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Подключаем JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
