<% load static %>
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Добавление товаров</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
    <script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
  <style>
    #selected-products { margin-top: 20px; }
    #selected-products table { width: 100%; }
  </style>
</head>
<body class="bg-light p-4">
  <div class="container">
    <h2>Добавление товаров</h2>

    <form id="add-product-form" method="post" action="{% url 'catalog:product_results' %}">
      {% csrf_token %}

      <!-- Выбор категории -->
      <div class="mb-3">
        <label for="category" class="form-label">Категория:</label>
        <select id="category" name="category_id" class="form-select" required>
          <option value="">-- выберите категорию --</option>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Добавление из базы -->
      <div class="mb-3">
        <label for="product-from-db" class="form-label">Добавить товар из БД:</label>
        <select id="product-from-db" class="form-select" disabled>
          <option value="">-- сначала выберите категорию --</option>
        </select>
        <button type="button" id="add-from-db" class="btn btn-primary mt-2" disabled>Добавить из БД</button>
      </div>

      <!-- Добавление произвольного товара с парсером -->
      <div class="mb-3">
        <label for="product-from-search" class="form-label">Добавить произвольный товар (поиск и парсер):</label>
        <input type="text" id="product-from-search" class="form-control" placeholder="Название товара">
        <button type="button" id="add-from-search" class="btn btn-secondary mt-2">Добавить по поиску</button>
      </div>

      <!-- Список выбранных товаров -->
      <div id="selected-products">
        <h4>Выбранные товары:</h4>
        <table class="table table-bordered">
          <thead>
            <tr><th>№</th><th>Название</th><th>Действие</th></tr>
          </thead>
          <tbody id="selected-products-body">
            <!-- Тут динамически добавляются выбранные товары -->
          </tbody>
        </table>
      </div>

      <button type="submit" class="btn btn-success mt-3">Сформировать итог</button>
    </form>

  </div>

  <script>
    let selectedProducts = [];

    function refreshSelectedTable() {
      const tbody = $('#selected-products-body');
      tbody.empty();
      selectedProducts.forEach((prod, i) => {
        tbody.append(`<tr>
          <td>${i + 1}</td>
          <td>${prod.name}</td>
          <td><button type="button" class="btn btn-danger btn-sm remove-btn" data-index="${i}">Удалить</button></td>
        </tr>`);
      });
    }

    // Удаление товара из списка
    $(document).on('click', '.remove-btn', function() {
      const idx = $(this).data('index');
      selectedProducts.splice(idx, 1);
      refreshSelectedTable();
    });

    // При выборе категории загружаем товары из БД через AJAX
    $('#category').on('change', function() {
      const catId = $(this).val();
      selectedProducts = []; // Очистить выбранные при смене категории
      refreshSelectedTable();

      if (!catId) {
        $('#product-from-db').prop('disabled', true).html('<option>-- сначала выберите категорию --</option>');
        $('#add-from-db').prop('disabled', true);
        return;
      }

      // Запрос товаров из выбранной категории
      $.get("{% url 'catalog:get_products_by_category' %}?category_id=" + catId, function(data) {
        if(data.products.length) {
          let options = '<option value="">-- выберите товар --</option>';
          data.products.forEach(p => {
            options += `<option value="${p.name}">${p.name}</option>`;
          });
          $('#product-from-db').html(options).prop('disabled', false);
          $('#add-from-db').prop('disabled', false);
        } else {
          $('#product-from-db').html('<option>Товаров нет</option>').prop('disabled', true);
          $('#add-from-db').prop('disabled', true);
        }
      });
    });

    // Добавить товар из БД в список
    $('#add-from-db').on('click', function() {
      const name = $('#product-from-db').val();
      if (!name) return alert('Выберите товар из списка');
      if(selectedProducts.find(p => p.name === name)) return alert('Товар уже добавлен');
      selectedProducts.push({name: name, from_db: true});
      refreshSelectedTable();
    });

    // Добавить товар из поиска (парсер)
    $('#add-from-search').on('click', function() {
      const name = $('#product-from-search').val().trim();
      if (!name) return alert('Введите название товара');
      if(selectedProducts.find(p => p.name === name)) return alert('Товар уже добавлен');
      selectedProducts.push({name: name, from_db: false});
      refreshSelectedTable();
      $('#product-from-search').val('');
    });

    // При отправке формы создаём скрытые поля с товарами
    $('#add-product-form').on('submit', function() {
      if (selectedProducts.length === 0) {
        alert('Добавьте хотя бы один товар');
        return false;
      }
      // Удаляем старые скрытые поля
      $('input[name="products[]"]').remove();
      // Добавляем новые скрытые поля с названиями товаров
      selectedProducts.forEach(p => {
        $('<input>').attr({
          type: 'hidden',
          name: 'products[]',
          value: p.name
        }).appendTo('#add-product-form');
      });
      return true;
    });
  </script>
</body>
</html>
